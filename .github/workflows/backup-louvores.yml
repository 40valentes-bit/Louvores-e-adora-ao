name: Build Louvores backup
on:
  push:
    branches:
      - backup/estavel-2026-11-17-37-musicas
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup/estavel-2026-11-17-37-musicas
      - name: Create source archive
        run: |
          mkdir -p dist
          zip -r dist/Louvores-codigo-2026-11-17.zip .             -x '.git/*' '.github/*' 'dist/*' '.env' '.env.*' '**/.env' '**/.env.*'
      - uses: actions/upload-artifact@v4
        with:
          name: louvores-codigo-backup
          path: dist/Louvores-codigo-2026-11-17.zip
          if-no-files-found: error
          retention-days: 30
